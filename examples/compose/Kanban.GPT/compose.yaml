# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  kanbangpt:
    image: ghcr.io/cngal/cngalwebsite-kanbangpt:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-kanbangpt}
    hostname: kanbangpt

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/app/storage"]
        user: root

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 事件总线 主机名称
      RabbitMq__HostName: ${RabbitMq__HostName:-}
      # 事件总线 端口
      RabbitMq__Port: ${RabbitMq__Port:-5672}
      # 事件总线 用户名
      RabbitMq__UserName: ${RabbitMq__UserName:-}
      # 事件总线 密码
      RabbitMq__Password: ${RabbitMq__Password:-}

      # GPT API KEY
      ChatGpt__ApiKey: ${ChatGpt__ApiKey:-}
      # GPT API url
      ChatGpt__BaseAddress: ${ChatGpt__BaseAddress:-}
      # GPT 模型名称
      ChatGpt__Model: ${ChatGpt__Model:-deepseek-flash}
      # 1分钟所有用户调用次数限制
      ChatGpt__GlobalRequestsPerMinute: ${ChatGpt__GlobalRequestsPerMinute:-30}
      # 1天所有用户调用次数限制
      ChatGpt__GlobalRequestsPerDay: ${ChatGpt__GlobalRequestsPerDay:-1000}
      # GPT 单次对话长度限制
      ChatGpt__MaxMessageLength: ${ChatGpt__MaxMessageLength:-30}
      # GPT 提示词
      ChatGpt__SystemMessageTemplate: ${ChatGpt__SystemMessageTemplate:-}
      # GPT 对话示例，用户部分
      ChatGpt__SampleUser: ${ChatGpt__SampleUser:-}
      # GPT 对话示例，看板娘部分
      ChatGpt__SampleKanban: ${ChatGpt__SampleKanban:-}
      # GPT 最大递归调用深度
      ChatGpt__MaxRecursionDepth: ${ChatGpt__MaxRecursionDepth:-10}
      # 是否启用函数调用
      ChatGpt__EnableFunctionCalling: ${ChatGpt__EnableFunctionCalling:-true}
      # 是否禁用个性化系统提示词
      ChatGpt__DisablePersonalizedSystem: ${ChatGpt__DisablePersonalizedSystem:-true}

      # CnGal API 路径
      CnGalApi__BaseAddress: ${CnGalApi__BaseAddress:-https://api.cngal.org/}

      # 持久化存储目录
      PersistentStorage__Directory: ${PersistentStorage__Directory:-/app/storage}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    volumes:
      - ${MNT_DIR:-/mnt/docker}/kanbangpt:/app/storage

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-100m}
