# Requires Docker Compose 5.4.0+ for pre_start hook image resolution.
services:
  robotclientx:
    image: ghcr.io/cngal/cngalwebsite-robotclientx:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-robotclientx}
    hostname: robotclientx

    restart: unless-stopped

    pre_start:
      - image: busybox
        command: ["chown", "-R", "1654:1654", "/home/app/.aspnet/DataProtection-Keys", "/app/wwwroot/Data"]
        user: root

    ports:
      - ${PORT:-2004}:8080

    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}

      # 机器人
      Robot__QQ: ${Robot__QQ:-0}
      Robot__Name: ${Robot__Name:-看板娘}
      Robot__WarningGroup: ${Robot__WarningGroup:-0}
      Robot__SensitiveReply: ${Robot__SensitiveReply:-}

      # OneBot Host（支持 IP 或主机名）
      OneBot__Host: ${OneBot__Host:-}
      # OneBot Websocket端口（必填）
      OneBot__WebSocketPort: ${OneBot__WebSocketPort:-0}
      # OneBot Http端口（必填）
      OneBot__HttpPort: ${OneBot__HttpPort:-0}
      # OneBot Token
      OneBot__Token: ${OneBot__Token:-}

      # CnGal资料站 API
      CnGalApi__BaseAddress: ${CnGalApi__BaseAddress:-https://api.cngal.org/}

      # 管理站点
      # 网站名称
      WebSite__Name: ${WebSite__Name:-看板娘在这里哦}
      # 网站背景图
      WebSite__BackgroundImageUrl: ${WebSite__BackgroundImageUrl:-https://res.cngal.org/_content/CnGalWebSite.Shared/images/game_head.png}

      # 回复限制
      ReplyLimits__SinglePerMinute: ${ReplyLimits__SinglePerMinute:-5}
      ReplyLimits__TotalPerMinute: ${ReplyLimits__TotalPerMinute:-10}

      # 群聊历史记录
      GroupHistory__MaximumMessages: ${GroupHistory__MaximumMessages:-30}
      GroupHistory__RetainedMessages: ${GroupHistory__RetainedMessages:-10}

      # 事件总线
      RabbitMq__HostName: ${RabbitMq__HostName:-}
      RabbitMq__Port: ${RabbitMq__Port:-5672}
      RabbitMq__UserName: ${RabbitMq__UserName:-}
      RabbitMq__Password: ${RabbitMq__Password:-}

    labels:
      com.centurylinklabs.watchtower.enable: ${WATCHTOWER_ENABLE:-true}

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/healthz"]

    volumes:
      - ${DATA_PROTECTION_KEYS_DIR:-robotclientx-DataProtection-Keys}:/home/app/.aspnet/DataProtection-Keys
      - ${MNT_DIR:-/mnt/docker}/robotclientx/Data:/app/wwwroot/Data

    deploy:
      resources:
        limits:
          memory: ${RESOURCES_LIMITS_MEMORY:-200m}

volumes:
  robotclientx-DataProtection-Keys:
