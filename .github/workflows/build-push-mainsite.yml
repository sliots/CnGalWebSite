name: Build and push MainSite

on:
  workflow_dispatch: # 手动触发

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/cngal/cngalwebsite-mainsite

concurrency:
  group: build-push-mainsite

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/master' && github.repository == 'CnGal/CnGalWebSite' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MainSite
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./CnGalWebSite/CnGalWebSite.MainSite/Dockerfile
          push: true
          cache-from: type=gha,scope=mainsite
          cache-to: type=gha,mode=max,scope=mainsite
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
